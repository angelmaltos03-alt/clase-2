<script>
'use strict';
const KEY='operacion_abastecimiento_v1';const VERSION=1;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n);
let storageOK=true,state=null,current=0,selected=null,order=[],hintsUsed=0,solved=false,answerMap={};let focusBeforeModal=null;
function fresh(name){return {version:VERSION,name:name.trim()||'Estudiante',group:'',created:new Date().toISOString(),seed:Math.floor(Math.random()*3),done:{},attempts:{},hints:{},choices:{},last:0};}
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p.version===VERSION&&typeof p.name==='string'&&p.done&&p.attempts&&p.hints&&p.choices&&[0,1,2].includes(p.seed))state=p;}}catch(e){storageOK=false;}
function save(){if(!state)return;try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}const el=$('#saveStatus');if(el)el.textContent=storageOK?'Avance guardado en este navegador.':'No se puede guardar aquí. Descarga tu evidencia antes de salir.';}
function mc(id,q,opts,correct,why,hints,lesson){return {id,type:'mc',q,opts,correct,why,hints,lesson};}
function num(id,q,answer,unit,why,hints,lesson,tolerance=0){return {id,type:'num',q,answer,unit,why,hints,lesson,tolerance};}
function match(id,q,rows,why,hints,lesson){return {id,type:'match',q,rows,why,hints,lesson};}
const finalCases=[{d:1200,s:100,i:300,p:200,prices:[20,21,18],freight:[1000,0,800],days:[4,3,8]},{d:1500,s:150,i:400,p:250,prices:[22,23,20],freight:[1500,0,700],days:[4,3,8]},{d:1800,s:200,i:450,p:350,prices:[24,25,22],freight:[1600,0,900],days:[4,3,8]}];
function missions(){const c=finalCases[state?.seed??0],q=c.d+c.s-c.i-c.p;const costs=c.prices.map((p,i)=>q*p+c.freight[i]);
return [
{title:'Detecta la necesidad',subtitle:'Primero, entiende el problema',topic:'1.6 · Proceso',icon:'01',story:'Acabas de integrarte a Empaques del Norte. Producción pide “1,000 cajas grandes y resistentes”. Tu primera misión es transformar esa frase en una solicitud que sí pueda atenderse.',reward:'Analista de necesidades',tasks:[
mc('need1','¿Qué debes hacer antes de pedir cotizaciones?',['Comprar 1,000 cajas al proveedor habitual.','Definir el uso, las especificaciones, la fecha y revisar disponibilidad.','Pedir la caja más barata y ajustar el producto después.'],1,['La costumbre no confirma que la cantidad o el modelo sean los adecuados.','Correcto: aclarar la necesidad y revisar recursos evita comprar material innecesario o incompatible.','Ajustar la operación a una compra incorrecta puede causar daños, retrasos y gastos adicionales.'],['La solicitud dice “grandes”, pero no establece medidas.','Primero verifica qué necesita la operación y qué tiene disponible; todavía no necesitas elegir proveedor.'],'Una necesidad expresa el problema por resolver. La especificación convierte esa necesidad en requisitos verificables. Antes de comprar, revisa inventarios, pedidos pendientes y alternativas internas.'),
mc('need2','¿Cuál especificación permite comparar propuestas equivalentes?',['Cajas económicas de buena calidad.','Cajas iguales a las del año pasado, sin más información.','Cajas nuevas de 40 × 30 × 25 cm interiores, cantidad y tolerancias definidas, resistencia verificada para el producto y entrega acordada.'],2,['“Buena calidad” y “económico” dependen de la interpretación. Faltan criterios de aceptación.','El proveedor puede desconocer el pedido anterior o haber cambiado el producto. Se necesita una referencia técnica vigente.','La descripción fija características verificables. La resistencia y las tolerancias deben detallarse en la ficha técnica.'],['Busca datos que el área receptora pueda comprobar.','Las dimensiones, condición, cantidad, resistencia y fecha reducen la ambigüedad.'],'Calidad adecuada significa cumplir el uso previsto. Distingue un requisito obligatorio de una preferencia: el incumplimiento de un requisito indispensable no se compensa con un descuento.'),
mc('need3','Almacén puede entregar todo el material necesario y está libre de compromisos. ¿Qué ruta sigue esta solicitud?',['Entregar y registrar la salida; gestionar la reposición según la política de inventario.','Comprar otra vez porque toda solicitud debe generar una orden.','Retirar material sin registro para ahorrar tiempo.'],0,['La necesidad puede atenderse sin una compra nueva. Registrar la salida permite mantener inventarios confiables.','Una necesidad no siempre requiere una adquisición: podrías duplicar existencias.','Sin registro, el sistema mostrará material que ya no está disponible y podría generar faltantes posteriores.'],['El objetivo es atender la necesidad, no generar pedidos.','Si ya existe material disponible, úsalo con registro y revisa después su reposición.'],'Existencia física y disponibilidad no son lo mismo. Un material reservado, dañado o bloqueado no debe contarse como disponible para una necesidad nueva.') ]},
{title:'Calcula el faltante',subtitle:'Inventario sin adivinanzas',topic:'1.6 · Planeación',icon:'02',story:'La demanda es de 1,000 cajas. Debes conservar 100 de reserva final. Hay 250 utilizables y llegarán 150 a tiempo. No hay otras reservas ni pedidos en este caso.',reward:'Guardián del inventario',tasks:[
num('inv1','¿Cuántas cajas debes comprar?',700,'cajas','Q = 1,000 + 100 − 250 − 150 = 700 cajas. Restas lo que ya tienes y lo que llegará a tiempo; sumas la reserva final.', ['No compres la demanda completa: ya existen recursos para cubrir una parte.','Usa Q = máximo de 0 y (demanda + reserva final − inventario utilizable − recepciones a tiempo).'],'Q = max(0, D + S − I − P). Todas las cantidades deben corresponder al mismo periodo y no contarse dos veces. Los pedidos que llegarán tarde no cubren esta necesidad.'),
num('inv2','Después de recibir y consumir las 1,000 cajas, ¿cuántas quedan?',100,'cajas','250 + 150 + 700 − 1,000 = 100. La comprobación confirma que conservas la reserva final.', ['Suma inventario, recepciones y la compra calculada. Luego resta el consumo.','250 + 150 + 700 − 1,000 = inventario final.'],'El balance de inventario permite verificar el resultado: inventario inicial + entradas − consumo = inventario final.'),
mc('inv3','Si las 150 cajas pendientes llegarán DESPUÉS del consumo, ¿qué cambia?',['Nada: todas las órdenes pendientes cuentan.','La cantidad de compra aumenta a 850 cajas, salvo una alternativa que cubra el plazo.','La compra disminuye a 550 cajas.'],1,['Tener una orden no significa que el material estará disponible cuando se necesita.','Correcto: 1,000 + 100 − 250 = 850. Es necesario asegurar el plazo o acordar otra solución con el área usuaria.','Eliminar una entrada oportuna aumenta el faltante; no lo reduce.'],['Pregunta si esas cajas estarán físicamente disponibles al usarse.','En la fórmula, las recepciones a tiempo pasan de 150 a 0.'],'El momento de llegada es tan importante como la cantidad. La planeación debe distinguir entradas confirmadas a tiempo de entradas tardías.') ]},
{title:'Activa la compra',subtitle:'Documentos y autorizaciones',topic:'1.6 · Control',icon:'03',story:'Ya sabes qué y cuánto necesitas. Ahora debes dejar una ruta documental clara entre Producción, Compras, el proveedor y Finanzas.',reward:'Coordinador del proceso',tasks:[
match('doc1','Relaciona cada documento con su función.',[
{label:'Requisición',options:['Oferta del proveedor','Solicitud interna de una necesidad','Comprobante de recepción'],correct:1,why:'La requisición nace dentro de la organización y comunica qué se requiere.'},
{label:'Cotización',options:['Oferta del proveedor','Autorización interna del inventario','Registro de salida de almacén'],correct:0,why:'La cotización presenta lo que el proveedor ofrece y sus condiciones.'},
{label:'Orden de compra',options:['Factura por el cobro','Registro de inspección','Pedido autorizado al proveedor'],correct:2,why:'La orden formaliza qué se pide y bajo qué condiciones.'}], 'Solicitar, ofrecer y ordenar son actos distintos. Estos documentos deben ser coherentes entre sí.',['Identifica quién emite cada documento: solicitante, proveedor o comprador.','La requisición solicita; la cotización ofrece; la orden formaliza.'],'La requisición es interna. La cotización la emite normalmente el proveedor. La orden la emite la organización compradora. Ninguna sustituye al registro de recepción.'),
mc('doc2','Finanzas no autoriza la compra porque falta la justificación. ¿Qué haces?',['Enviar la orden para no perder tiempo.','Dividir el monto en varias compras para evitar la revisión.','Devolver la solicitud para completar la información y someterla a autorización.'],2,['Emitir una orden sin la autorización requerida evade el control interno.','Fraccionar para eludir la revisión oculta el compromiso real y deteriora la trazabilidad.','La ruta de corrección permite completar la información. Si la necesidad no procede, se documenta su cancelación o postergación.'],['La negativa no obliga siempre a cancelar; puede ser una solicitud incompleta.','Corrige la causa y vuelve al punto de autorización.'],'Un proceso debe mostrar qué ocurre cuando una solicitud no se autoriza: corregir, modificar, posponer o cancelar. No se deben omitir los controles para resolver una urgencia.'),
mc('doc3','¿Qué acuerdo conviene dejar claro al formalizar el pedido?',['Solamente el precio.','Cantidad, especificaciones, entrega, pago y respuesta ante incumplimientos.','Únicamente el nombre del proveedor.'],1,['El precio no aclara qué entregar ni cómo resolver diferencias.','La orden y las condiciones acordadas deben permitir verificar el cumplimiento y resolver desviaciones.','Identificar al proveedor es necesario, pero no describe el compromiso.'],['Imagina que llegan cajas dañadas: ¿qué necesitarías haber acordado?','Define qué se entrega, cuándo, dónde, cómo se paga y cómo se resuelven las fallas.'],'Negociar abarca precio, entrega, transporte, pago, garantía y reposición. La confirmación del proveedor detecta interpretaciones distintas antes del envío.') ]},
{title:'Elige al proveedor',subtitle:'El menor precio no decide solo',topic:'1.8 · Costo y oportunidad',icon:'04',story:'Necesitas 700 cajas en un máximo de cinco días. Todos cumplen las especificaciones. Compara importes en pesos, sin impuestos y bajo la misma base.',table:{heads:['Variable','A','B','C'],rows:[['Precio unitario','$18','$19','$17'],['Transporte','$1,400','Incluido','$900'],['Entrega','4 días','3 días','10 días']]},reward:'Negociador con criterio',tasks:[
num('prov1','¿Cuál es el costo entregado del proveedor A?',14000,'pesos','700 × $18 + $1,400 = $14,000. El flete forma parte del costo de recibir estas cajas.',['Multiplica cantidad por precio y agrega transporte.','El producto cuesta $12,600. Falta agregar el flete de $1,400.'],'Para esta comparación: total = cantidad × precio unitario + transporte. Otros casos pueden incluir instalación, inspección u otros costos relevantes.'),
mc('prov2','¿Qué propuesta no cumple un requisito obligatorio?',['A: tarda 4 días.','B: tarda 3 días.','C: tarda 10 días.'],2,['Cuatro días está dentro del máximo de cinco.','Tres días está dentro del máximo de cinco.','C llega después del plazo. No debe elegirse sin una solución viable y aprobada que cubra la necesidad a tiempo.'],['El límite es de cinco días.','Primero filtra las propuestas que sí llegarán dentro del plazo.'],'Los requisitos obligatorios se verifican antes de ponderar ventajas. Un descuento no compensa una entrega que vuelve imposible atender la operación.'),
mc('prov3','Entre las propuestas que cumplen, ¿cuál elegirías con estos datos?',['A: tiene el menor precio unitario de las dos.','B: total $13,300 y entrega en 3 días.','C: total $12,800 aunque llegue tarde.'],1,['A suma $14,000 con transporte. Su menor precio unitario no produce el menor costo entregado.','B cumple el plazo y cuesta menos que A. Esta decisión depende de los datos del caso, no de una preferencia universal.','C presenta el menor total, pero incumple el plazo indispensable.'],['Compara A y B incluyendo el flete.','A cuesta $14,000 y B cuesta 700 × $19 = $13,300.'],'Precio, costo y valor son distintos. La selección combina cumplimiento técnico, oportunidad, costos y condiciones, con justificación documentada.') ]},
{title:'Resuelve la entrega',subtitle:'Recibir no es aceptar',topic:'1.6 · Verificación',icon:'05',story:'Llegaron las 700 cajas, pero 80 están húmedas. El proveedor facturó las 700. Producción necesita saber qué puede usar y Compras debe gestionar la diferencia.',reward:'Inspector de cumplimiento',tasks:[
mc('rec1','¿Qué registras en la recepción?',['700 recibidas físicamente; 620 conformes y 80 no conformes identificadas.','700 conformes: llegaron todas.','Nada hasta que el proveedor emita otra factura.'],0,['La cantidad recibida y la cantidad aceptada deben distinguirse. Controla las 80 no conformes para impedir su uso accidental.','La entrega puede estar completa en cantidad y fallar en calidad.','La recepción física debe documentarse aunque exista una diferencia comercial pendiente.'],['Cuenta por separado lo que llegó y lo que cumple.','700 menos 80 no conformes deja 620 utilizables.'],'La recepción verifica identidad y cantidad; la inspección determina conformidad. Un producto no conforme requiere identificación y una solución autorizada.'),
num('rec2','¿Qué porcentaje de la entrega fue rechazado? Redondea a dos decimales.',11.43,'%','80 ÷ 700 × 100 = 11.43 %. El denominador es la cantidad recibida, no la aceptada.', ['Divide unidades rechazadas entre unidades recibidas.','80 ÷ 700 da aproximadamente 0.1142857; multiplícalo por 100.'],'Porcentaje de rechazo = (unidades rechazadas / unidades recibidas) × 100. Este indicador describe la entrega; para evaluar al proveedor también revisa gravedad, repetición y respuesta.',.005),
mc('rec3','Antes de aprobar el cobro, ¿qué control aplicas?',['Comparar orden, recepción aceptada y factura; resolver la diferencia según el acuerdo.','Pagar todo solamente porque existe factura.','Ocultar las cajas dañadas para cerrar el pedido.'],0,['La conciliación evita aprobar cargos que no correspondan. La reposición, devolución o ajuste se documenta según lo pactado.','La factura no prueba por sí sola que se recibió y aceptó todo.','Ocultar diferencias impide corregirlas y puede afectar la operación y el pago.'],['Necesitas confirmar lo acordado, lo aceptado y lo cobrado.','Compara tres documentos: orden, recepción y factura.'],'El pago sigue las condiciones acordadas: contado, anticipo, crédito o avances. En este caso se revisa después de la recepción. Evalúa al proveedor y conserva evidencia de la solución.') ]},
{title:'Clasifica la operación',subtitle:'Una compra, varios criterios',topic:'1.7 · Clasificación',icon:'06',story:'La empresa maneja materias primas, refacciones, servicios y equipos. Tu misión es reconocer que cada clasificación responde a una pregunta distinta.',reward:'Especialista en categorías',tasks:[
match('class1','Una panadería compra harina cada semana a un proveedor de su ciudad. Clasifica sin inventar datos.',[
{label:'Según destino',options:['Indirecta','Directa'],correct:1,why:'La harina se incorpora al pan que se vende: compra directa.'},
{label:'Según frecuencia',options:['Recurrente','Ocasional'],correct:0,why:'La compra semanal se repite con regularidad.'},
{label:'Según procedencia del suministro',options:['Internacional','Local'],correct:1,why:'El proveedor está en la misma ciudad. Local también es nacional.'}], 'Es directa, recurrente y local. No sabemos si es programada: repetir una compra no prueba que se haya planeado.',['Cada criterio responde a algo distinto: uso, regularidad y lugar.','La harina forma parte del pan; la compra se repite semanalmente; el suministro es cercano.'],'Las categorías se combinan. Directa e indirecta dependen del uso. Recurrente describe frecuencia; programada describe anticipación. No son sinónimos.'),
match('class2','Relaciona las situaciones con la clasificación más específica.',[
{label:'Sensor comprado por una avería inesperada',options:['Urgente','Estacional','Para reventa'],correct:0,why:'La urgencia describe el plazo reducido. La refacción también puede ser MRO.'},
{label:'Una oficina central negocia para todas las plantas',options:['Descentralizada','Centralizada','Consignación'],correct:1,why:'La gestión se concentra en un área para varias unidades.'},
{label:'Proveedor conserva propiedad hasta el consumo pactado',options:['Justo a tiempo','Compra internacional','Consignación'],correct:2,why:'La consignación se define por el acuerdo de propiedad y consumo, no por el país ni el plazo.'}], 'La compra se administra de acuerdo con su contexto: urgencia, organización o modalidad de abastecimiento.',['No uses la misma pregunta para las tres situaciones.','Busca plazo reducido, concentración de decisiones y propiedad hasta consumo.'],'Otras categorías: bienes de capital (uso durante varios periodos), servicios (actividades o resultados), MRO (mantenimiento, reparación y operación), entregas programadas y abastecimiento bajo pedido.'),
mc('class3','Un sensor económico solo tiene una fuente viable y su ausencia detiene una máquina. ¿Qué conviene priorizar?',['Tratarlo como irrelevante por su bajo precio.','Proteger la continuidad y desarrollar alternativas de suministro.','Eliminar toda reserva sin revisar el plazo.'],1,['El costo de faltar puede superar por mucho el precio del sensor.','La dificultad de suministro y el impacto operativo justifican atención especial, aun si el artículo es barato.','Reducir existencias sin analizar consumo, plazo y riesgo puede aumentar las interrupciones.'],['Piensa en el costo de detener la máquina, no solo en el precio del sensor.','La prioridad es asegurar disponibilidad y disminuir dependencia.'],'Una única fuente disponible significa que no se identificó otra viable. Una sola fuente elegida puede existir aunque haya alternativas. El riesgo y el impacto orientan la estrategia.') ]},
{title:'Defiende tus principios',subtitle:'Decisiones responsables',topic:'1.8 · Principios',icon:'07',story:'Llegan propuestas tentadoras: descuentos, rapidez y recomendaciones personales. No basta con obtener un pedido; debes poder justificar la decisión.',reward:'Comprador responsable',tasks:[
mc('princ1','Consumes 100 litros al mes. Ofrecen descuento por 2,000 litros con vida útil restante de seis meses. ¿Qué haces?',['Aceptar: cualquier descuento reduce el costo total.','Evaluar demanda, caducidad y almacenamiento: al consumo actual se usarían unos 600 litros.','Comprar más para aumentar el descuento.'],1,['El ahorro unitario puede perderse si el material vence, ocupa espacio o inmoviliza dinero.','La cantidad adecuada considera consumo y vida útil. Con esos datos, 1,400 litros podrían quedar sin uso al vencimiento.','Aumentar cantidad sin necesidad agrava el exceso y el riesgo de desperdicio.'],['Multiplica 100 litros por seis meses.','El consumo previsto es 600 litros, muy inferior a los 2,000 ofrecidos.'],'Cantidad adecuada equilibra faltantes y excesos. Comprar para inventario implica costos de espacio, capital, manejo y deterioro.'),
mc('princ2','A cuesta $20,000 + $15,000 de energía + $6,000 de mantenimiento. B cuesta $24,000 + $9,000 + $3,000. A igual capacidad y en tres años, ¿cuál tiene menor total simplificado?',['A, porque cuesta menos al comprarlo.','B, con $36,000 frente a $41,000 de A.','Son iguales.'],1,['Falta considerar uso y mantenimiento: A suma $41,000.','B tiene el menor total bajo estos supuestos. No se incluyen impuestos, financiamiento ni valor residual.','A y B no tienen el mismo total: difieren en $5,000.'],['Suma tres conceptos para cada equipo.','A: 20 + 15 + 6 = 41 mil. B: 24 + 9 + 3 = 36 mil.'],'El costo total puede incluir compra, instalación, operación, mantenimiento y disposición final. Compara alternativas con capacidad y horizonte equivalentes.'),
mc('princ3','Un familiar del comprador ofrece suministrar. ¿Cuál es la actuación correcta?',['Elegirlo sin evaluación por la confianza.','Declarar y gestionar el conflicto de interés conforme a las reglas; mantener evaluación objetiva y documentada.','Pedirle un regalo para asegurar su compromiso.'],1,['La relación personal no sustituye requisitos ni controles.','Se necesita transparencia y gestionar la participación del comprador según las políticas, sin ocultar la relación.','Un beneficio personal puede comprometer la imparcialidad y debe evitarse.'],['La decisión debe poder justificarse sin depender de la relación personal.','Declara el conflicto y aplica controles de imparcialidad y trazabilidad.'],'Ética: evitar favoritismos y beneficios personales. Separación de funciones: distribuir solicitud, autorización, recepción y pago. Sostenibilidad: convertir durabilidad, consumo y residuos en criterios verificables.'),
match('princ4','Identifica el principio que falla.',[
{label:'Cajas correctas entregadas después del embarque',options:['Lugar','Momento','Cantidad'],correct:1,why:'Llegaron tarde para el uso previsto: falla de oportunidad.'},
{label:'Pedido entregado en otra sucursal',options:['Lugar','Precio','Cantidad'],correct:0,why:'El recurso no está en el punto acordado.'},
{label:'Cajas que se deforman con el peso especificado',options:['Momento','Lugar','Calidad'],correct:2,why:'No cumplen la resistencia requerida para su uso.'}], 'Calidad, cantidad, momento, lugar y precio/condiciones deben analizarse juntos.',['Pregunta qué condición impide atender la necesidad en cada caso.','Tarde = momento; sucursal equivocada = lugar; resistencia insuficiente = calidad.'],'No basta con cumplir cuatro principios si el quinto vuelve inutilizable la compra. El proveedor adecuado y el riesgo aceptable complementan la evaluación.') ]},
{title:'Construye el proceso',subtitle:'Tu primera evidencia visual',topic:'1.6 · Diagrama',icon:'08',story:'Una auditoría encuentra las etapas desordenadas. Reconstruye el flujo base y decide qué rutas deben aparecer cuando hay excepciones. Usa las flechas para mover las tarjetas; también funciona con teclado.',reward:'Arquitecto del proceso',tasks:[
{id:'flow1',type:'order',q:'Ordena el proceso para una compra con pago posterior a la recepción.',items:['Definir necesidad y revisar disponibilidad','Especificar y elaborar requisición','Autorizar solicitud y presupuesto','Buscar proveedores y evaluar cotizaciones','Negociar y formalizar la orden','Confirmar pedido y dar seguimiento','Recibir, inspeccionar y resolver diferencias','Conciliar documentos y pagar según acuerdo','Evaluar proveedor y retroalimentar'],why:'El orden integra necesidad, autorización, selección y cumplimiento. Es un modelo didáctico; anticipos y contratos especiales requieren adaptar el flujo.',hints:['Primero define y valida la necesidad; después compromete recursos.','Agrupa en tres bloques: preparar (1–3), comprar (4–6), verificar y aprender (7–9).'],lesson:'Un diagrama combina actividades (rectángulos), decisiones (rombos), flechas e inicio/fin. Sus rutas deben mostrar tanto el cumplimiento como las excepciones.'},
mc('flow2','¿Cómo representas “¿Se autoriza la requisición?”?',['En un rectángulo sin salidas.','En un rombo con rutas Sí y No; No lleva a corregir, posponer o cancelar según corresponda.','En un óvalo de fin, siempre.'],1,['Un rectángulo representa una actividad; aquí se requiere distinguir dos resultados.','La decisión debe tener salidas identificadas. La corrección regresa a validación; cancelar o posponer debe quedar documentado.','La autorización no es siempre el final: normalmente permite continuar hacia la selección.'],['Es una pregunta que cambia la ruta del proceso.','Usa un rombo y describe qué pasa en ambas respuestas.'],'Una ruta de excepción no debe quedar desconectada. Si se corrige una solicitud, vuelve al control aplicable; si no procede, documenta su cierre o postergación.'),
mc('flow3','La inspección detecta material no conforme. ¿Qué ruta debe mostrar el diagrama?',['Pasar directamente a “pagar todo”.','Ocultar la diferencia y cerrar.','Registrar diferencia, gestionar solución y volver a verificar si hay reposición; si se cancela, conciliar y revisar la necesidad pendiente.'],2,['La aceptación no está completa y la diferencia debe resolverse según lo acordado.','El cierre administrativo no demuestra que la necesidad fue satisfecha.','La ruta contempla reposición o cierre documentado, sin confundir cancelación con necesidad atendida.'],['No todo incumplimiento termina en reposición; puede haber devolución o cancelación.','Registra, acuerda la solución y vuelve al control correspondiente.'],'Cerrar un pedido cancelado puede dejar la necesidad original sin resolver. La evidencia debe distinguir operación cerrada y necesidad atendida.') ]},
{title:'Salva el siguiente lote',subtitle:'Caso final de Empaques del Norte',topic:'Integración · 1.6—1.8',icon:'09',story:`Producción requiere ${c.d.toLocaleString('es-MX')} cajas y una reserva final de ${c.s}. Tienes ${c.i} utilizables y recibirás ${c.p} antes del consumo. El nuevo pedido debe estar disponible en cinco días. Todos los proveedores cumplen especificaciones.`,table:{heads:['Variable','A','B','C'],rows:[['Precio unitario',...c.prices.map(money)],['Transporte',...c.freight.map(n=>n?money(n):'Incluido')],['Entrega',...c.days.map(n=>n+' días')]]},reward:'Líder de abastecimiento',tasks:[
num('final1','Calcula la cantidad por comprar.',q,'cajas',`${c.d} + ${c.s} − ${c.i} − ${c.p} = ${q} cajas. La compra cubre demanda y reserva final.`,['Usa el mismo balance aprendido en la misión 2.',`Demanda ${c.d} + reserva ${c.s} − utilizable ${c.i} − recepciones ${c.p}.`],'Antes de cotizar, verifica disponibilidad y calcula el faltante del periodo.'),
num('final2','Calcula el total entregado del proveedor B.',costs[1],'pesos',`${q} × ${money(c.prices[1])} = ${money(costs[1])}; el transporte está incluido.`,['Usa la cantidad por comprar, no toda la demanda.',`Multiplica ${q} por ${c.prices[1]}. No agregues otro flete.`],'Compara el costo de satisfacer la misma cantidad y calidad, bajo una base equivalente.'),
mc('final3','¿Cuál recomendación está mejor sustentada?', ['A: elegirlo únicamente por su precio unitario.',`B: cumple el plazo y su total ${money(costs[1])} es menor que el de A (${money(costs[0])}).`,`C: elegirlo por ${money(costs[2])}, aunque llegue en ocho días.`],1,['A cumple, pero B tiene menor total entregado con los datos del caso.','La decisión filtra primero la fecha obligatoria y después compara costos entre opciones viables.','C incumple la fecha máxima; su menor costo no resuelve esa restricción.'],['Filtra por cinco días antes de comparar precios.',`A suma ${money(costs[0])}; B ${money(costs[1])}; C tarda ocho días.`],'Una recomendación profesional explica los requisitos, la comparación y los supuestos.'),
mc('final4','Dos días antes de entregar, B anuncia retraso. ¿Qué haces?',['Esperar en silencio hasta el día de consumo.','Coordinar una solución viable: entrega parcial, alternativa autorizada o ajuste con Producción; documentar impacto y seguimiento.','Cerrar la orden como si estuviera cumplida.'],1,['Esperar reduce las alternativas para proteger la operación.','El seguimiento permite actuar antes del faltante. La solución requiere coordinación y autorización según el caso.','No existe evidencia de entrega ni aceptación. Cerrar no elimina el riesgo.'],['Detectar temprano una desviación permite actuar.','Coordina suministro y operación; evalúa costos, plazo y autorizaciones de la alternativa.'],'No prometas continuidad sin confirmar capacidad y fechas. Documenta la solución y evalúa después el desempeño.'),
mc('final5','¿Qué evidencia demuestra mejor que el proceso se gestionó correctamente?',['Solo una captura del precio.','Un diagrama con decisiones, documentos coherentes, aceptación y diferencias resueltas, junto con una evaluación justificada.','Solo decir que el proveedor es conocido.'],1,['Un precio no muestra autorización, recepción ni resolución de incumplimientos.','La trazabilidad permite reconstruir la necesidad, las decisiones y los resultados, incluyendo excepciones.','La confianza no sustituye evidencia verificable.'],['La evidencia debe cubrir todo el proceso, no solo la selección.','Incluye decisiones, responsables, registros y verificación del cumplimiento.'],'El diagrama es la evidencia principal de esta sesión. Debe representar una secuencia funcional y las rutas de excepción.') ]}
];}
const allTasks=()=>missions().flatMap(m=>m.tasks);const totalTasks=()=>allTasks().length;
function completed(m){return m.tasks.every(t=>state?.done[t.id]);}function unlock(){const ms=missions();const n=ms.findIndex(m=>!completed(m));return n<0?ms.length-1:n;}
function stats(){const tasks=allTasks();const done=tasks.filter(t=>state?.done[t.id]);return {n:done.length,total:tasks.length,points:done.reduce((s,t)=>s+state.done[t.id].points,0),first:done.filter(t=>state.done[t.id].attempts===1&&state.done[t.id].hints===0).length,help:done.filter(t=>state.done[t.id].attempts>1||state.done[t.id].hints>0).length};}
function shuffle(a){let out=a.map((_,i)=>i);for(let i=out.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}if(out.every((v,i)=>v===i))out.push(out.shift());return out;}
function tableHTML(t){return `<div class="table-scroll"><table><thead><tr>${t.heads.map(v=>`<th scope="col">${esc(v)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map((v,i)=>i?`<td>${esc(v)}</td>`:`<th scope="row">${esc(v)}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function landing(){const s=state?stats():null;$('#app').innerHTML=`<section class="hero"><div><p class="eyebrow">Simulador de decisiones · Sesión 2</p><h1>La operación<br>depende de<br><span>tu próxima compra.</span></h1><p class="muted">Conviértete en responsable de abastecimiento. Revisa inventarios, elige proveedores y evita que una mala decisión detenga la producción.</p><div class="features"><span><b>09</b> misiones conectadas</span><span><b>${totalTasks()}</b> retos con retroalimentación</span><span><b>∞</b> oportunidades de aprender</span></div><details class="knowledge"><summary>¿Cómo se juega?</summary><div class="inside">Lee el caso, responde y comprueba tu decisión. Si te equivocas, recibe una explicación y vuelve a intentarlo. Usa pistas o la nota de clase cuando lo necesites. Las misiones se desbloquean al completar la anterior. Obtienes 100 puntos por reto resuelto sin ayuda al primer intento, 80 si consultas pistas y 60 si necesitas reintentos. Los puntos no son una calificación oficial.</div></details></div><div class="brief"><p class="eyebrow">Tu encargo</p><h2>Empaques del Norte<br>necesita un plan.</h2><p class="muted">Hay pedidos por entregar, materiales que revisar y proveedores que evaluar. Tu objetivo: asegurar el recurso correcto, a tiempo y con una decisión justificable.</p><div class="mini-grid"><div class="mini"><strong>1.6</strong><span>Proceso y flujo</span></div><div class="mini"><strong>1.7</strong><span>Clasificación</span></div><div class="mini"><strong>1.8</strong><span>Principios</span></div></div>${state?`<div style="margin-top:24px"><p>Bienvenido de nuevo, <strong>${esc(state.name)}</strong>.</p><p class="muted">${s.n} de ${s.total} retos completados · ${s.points} puntos</p><div class="start-row"><button class="primary" id="resume">Continuar operación →</button><button class="small ghost" id="newUser">Nuevo participante</button></div></div>`:`<form id="startForm"><label class="field"><span>¿Cómo te llamas?</span><input id="studentName" autocomplete="name" maxlength="70" placeholder="Escribe tu nombre" required></label><label class="field"><span>Grupo (opcional)</span><input id="studentGroup" maxlength="40" placeholder="Ej. 8.º A"></label><button class="primary" type="submit">Iniciar primera misión →</button></form>`}<p class="statusline" style="margin-top:18px">${storageOK?'El avance se guarda en este navegador. No se envían datos.':'Guardado no disponible: puedes jugar y descargar evidencia antes de salir.'}</p></div></section>`;
if(state){$('#resume').onclick=()=>{current=Math.min(Number(state.last)||0,unlock());render();};$('#newUser').onclick=resetDialog;}else{$('#startForm').onsubmit=e=>{e.preventDefault();const name=$('#studentName').value.trim();if(!name){$('#studentName').setCustomValidity('Escribe tu nombre para identificar la evidencia.');$('#studentName').reportValidity();return;}state=fresh(name);state.group=$('#studentGroup').value.trim();current=0;save();render();};$('#studentName').oninput=e=>e.target.setCustomValidity('');}}

function move(t,i,d){if(solved)return;const j=i+d;if(j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];state.choices[t.id]=order.slice();save();$('#answerArea').innerHTML=answerHTML(t);bindAnswer(t);const selector=d<0&&j>0?`[data-up="${j}"]`:`[data-down="${j}"]`;const el=$(selector);if(el&&!el.disabled)el.focus({preventScroll:true});}

function check(t){if(solved||state.done[t.id])return;let ok=false,why='',ans;
if(t.type==='mc'){if(selected===null){showFeedback('Selecciona una opción','Elige una respuesta antes de comprobar.','info');return;}ans=selected;ok=selected===t.correct;why=esc(t.why[selected]);}
else if(t.type==='num'){const raw=$('#numberAnswer').value.trim().replace(/\s/g,'');if(!/^-?\d+(?:[.,]\d+)?$/.test(raw)){showFeedback('Escribe un número válido','Usa dígitos sin separadores de miles. Para decimales puedes usar punto o coma.','info');return;}ans=Number(raw.replace(',','.'));ok=Math.abs(ans-t.answer)<=(t.tolerance||0);if(ok)why=esc(t.why);else if(ans<0)why='Una compra, una existencia o un porcentaje de este caso no puede ser negativo. Revisa el balance y las unidades.';else why=`Tu resultado fue ${esc(raw)} ${esc(t.unit)}. ${esc(t.hints[0])} Revisa los datos y la operación antes de intentarlo otra vez.`;}
else if(t.type==='match'){ans=t.rows.map((r,i)=>$('#match'+i).value);if(ans.some(a=>a==='')){showFeedback('Falta una relación','Selecciona una respuesta en cada fila.','info');return;}ok=ans.every((a,i)=>Number(a)===t.rows[i].correct);why=t.rows.map((r,i)=>`<p><strong>${Number(ans[i])===r.correct?'✓':'Revisa'} ${esc(r.label)}:</strong> ${esc(r.why)}</p>`).join('');}
else {ans=order.slice();ok=order.every((v,i)=>v===i);const first=order.findIndex((v,i)=>v!==i);why=ok?esc(t.why):`La primera etapa fuera de lugar es la ${first+1}. Aquí debe ir <strong>${esc(t.items[first])}</strong>. ${esc(t.hints[0])}`;}

}

function diagramEvidenceHTML(){const imgs=NOTE_HTML.match(/<img[^>]*>/g)||[];return imgs.map((img,i)=>`<section class="diagram-step" style="${i?'break-before:page;':''}break-inside:avoid"><h3>${['Necesidad y autorización','Selección del proveedor','Cumplimiento y cierre'][i]}</h3>${img.replace('<img ','<img style="display:block;width:100%;max-height:660px;object-fit:contain" ')}</section>`).join('');}
function reportHTML(){const s=stats(),ms=missions(),c=finalCases[state.seed],q=c.d+c.s-c.i-c.p,flowDone=completed(ms[7]),doneAll=s.n===s.total;const refuerzo=ms.filter(m=>m.tasks.some(t=>(state.attempts[t.id]||0)>1||(state.hints[t.id]||0)>0));return `<article class="report"><p class="report-meta">ADMINISTRACIÓN DE COMPRAS Y ABASTECIMIENTO · AA-0807</p><h2>Evidencia de aprendizaje<br>Operación Abastecimiento</h2><p><strong>Estudiante:</strong> ${esc(state.name)}<br><strong>Grupo:</strong> ${esc(state.group||'Sin especificar')}<br><strong>Fecha de exportación:</strong> ${esc(new Date().toLocaleString('es-MX'))}<br><strong>Estado:</strong> ${doneAll?'Operación completa':'Avance parcial'}</p><p>${s.n} de ${s.total} retos superados · ${s.points} de ${s.total*100} puntos posibles.<br>${s.first} resueltos sin pistas al primer intento · ${s.help} resueltos con apoyo.</p><p class="warning">Registro de práctica con retroalimentación. No es una calificación oficial ni una certificación de identidad. El avance se conserva localmente y no se envía al docente.</p><table><thead><tr><th>Misión</th><th>Retos</th><th>Intentos registrados</th><th>Puntos</th></tr></thead><tbody>${ms.map(m=>`<tr><td>${esc(m.icon+' · '+m.title)}</td><td>${m.tasks.filter(t=>state.done[t.id]).length}/${m.tasks.length}</td><td>${m.tasks.reduce((n,t)=>n+(state.attempts[t.id]||0),0)}</td><td>${m.tasks.reduce((n,t)=>n+(state.done[t.id]?.points||0),0)}</td></tr>`).join('')}</tbody></table><h3>Qué conviene reforzar</h3><p>${refuerzo.length?refuerzo.map(m=>esc(m.title)).join(' · '):'No se registran pistas o reintentos hasta este momento. Revisa también los temas que todavía no has completado.'}</p>${completed(ms[8])?`<h3>Decisión del caso final</h3><p>Demanda: ${c.d}; reserva final: ${c.s}; inventario: ${c.i}; recepciones a tiempo: ${c.p}.</p><p><strong>Cantidad por comprar:</strong> ${q} cajas. <strong>Proveedor seleccionado:</strong> B. Total: ${money(q*c.prices[1])}. Cumple el máximo de cinco días y tiene menor costo entregado que A. C incumple el plazo.</p>`:'<p class="warning">El caso final aún no está completo. Su decisión aparecerá al resolver la misión 9.</p>'}<h3>Reflexión del estudiante</h3><p>Explica con tus propias palabras una decisión que corregiste y por qué. Completa este apartado antes de entregar tu evidencia.</p><p style="min-height:70px;border-bottom:1px solid #9aa">${esc(state.reflection||'')}</p>${flowDone?`<div class="diagram-pair"><div><h3>Diagrama del proceso validado</h3><p class="warning">Modelo generado a partir de las etapas ordenadas y las rutas de excepción resueltas en la misión 8. Supone pago posterior a la recepción.</p>${diagramEvidenceHTML()}</div><div><h3>Responsables y evidencias</h3><table><thead><tr><th>Etapa</th><th>Responsable habitual</th><th>Evidencia</th></tr></thead><tbody><tr><td>Necesidad</td><td>Área solicitante y Almacén</td><td>Revisión de disponibilidad</td></tr><tr><td>Autorización</td><td>Jefatura y Finanzas</td><td>Requisición autorizada</td></tr><tr><td>Selección</td><td>Compras y área técnica</td><td>Cotizaciones y evaluación</td></tr><tr><td>Formalización</td><td>Compras</td><td>Orden y confirmación</td></tr><tr><td>Recepción</td><td>Almacén y Calidad o usuario</td><td>Recepción e inspección</td></tr><tr><td>Pago</td><td>Finanzas</td><td>Conciliación documental</td></tr><tr><td>Mejora</td><td>Compras y áreas usuarias</td><td>Evaluación del proveedor</td></tr></tbody></table><p>Los responsables específicos y las autorizaciones se ajustan a la organización. Si hay anticipo, se agrega su autorización y seguimiento.</p></div></div>`:'<p class="warning">El diagrama de evidencia se habilita al completar la misión 8.</p>'}</article>`;}
function openReport(){if(!state){showModal('Tu evidencia','<p>Inicia una misión para generar tu reporte. Podrás descargar avances parciales y el resultado completo.</p>');return;}showModal('Tu evidencia de aprendizaje',`<p class="muted">Descarga el reporte o imprímelo como PDF desde tu navegador. Puedes compartir el archivo con tu docente.</p><label class="field"><span>Tu reflexión: ¿qué corregiste y qué aprendiste?</span><input id="reflection" maxlength="1000" value="${esc(state.reflection||'')}" placeholder="Escribe tu reflexión antes de descargar"></label><div class="actions"><button class="primary" id="downloadEvidence">Descargar reporte HTML</button><button id="printEvidence">Imprimir / guardar PDF</button></div><div id="reportPreview">${reportHTML()}</div>`);$('#reflection').oninput=e=>{state.reflection=e.target.value;save();$('#reportPreview').innerHTML=reportHTML();};$('#downloadEvidence').onclick=downloadReport;$('#printEvidence').onclick=()=>{$('#printRoot').innerHTML=reportHTML();window.print();};}
function downloadReport(){if(!state)return;const body=reportHTML();const html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidencia de compras</title><style>body{font:15px/1.55 Arial,sans-serif;color:#142434;background:white;max-width:950px;margin:35px auto;padding:0 20px}h2{font-size:28px;line-height:1.2}h3{margin-top:30px}table{width:100%;border-collapse:collapse;margin:20px 0}td,th{padding:10px;border:1px solid #cdd6dc;text-align:left}th{background:#e7eff1}.warning,.report-meta{font-size:13px;color:#4d5d68}svg{display:block;width:100%;max-height:950px}.diagram-pair>div{break-before:page}@media print{body{margin:0;font-size:11pt}svg{max-height:680px}td,th{padding:6px}.diagram-pair>div{break-before:page}@page{size:letter;margin:16mm}}</style></head><body>${body}</body></html>`;const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Evidencia_Compras_'+state.name.replace(/[^a-záéíóúñ0-9]/gi,'_').slice(0,50)+'.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const NOTE_HTML="<details><summary>1. Propósito de la sesión</summary><div class=\"note-body\"><p>Comprar dentro de una empresa implica coordinar decisiones, personas, información y recursos. Antes de adquirir un producto, es necesario conocer qué se necesita, verificar si ya existe, establecer sus características, identificar proveedores y determinar las condiciones de adquisición.</p><p>Después de colocar el pedido, todavía falta comprobar que se entregue correctamente, que cumpla las especificaciones y que la operación quede documentada.</p><p>El propósito de esta sesión es comprender <strong>cómo se organiza el proceso de compras, por qué existen diferentes tipos de adquisiciones y qué principios permiten tomar decisiones convenientes para la organización</strong>.</p><p>Al finalizar la lectura podrás:</p><ul><li>Explicar las etapas del proceso general de compra.</li><li>Diferenciar una requisición, una cotización y una orden de compra.</li><li>Representar actividades y decisiones mediante un diagrama de flujo.</li><li>Clasificar compras utilizando distintos criterios.</li><li>Analizar decisiones considerando calidad, cantidad, costo, oportunidad y responsabilidad.</li><li>Identificar fallas que pueden afectar el abastecimiento.</li></ul></div></details><details><summary>2. Situación inicial: una compra que parece sencilla</summary><div class=\"note-body\"><p>Una fábrica necesita cajas de cartón para entregar sus productos. El responsable de producción solicita que se compren 1,000 cajas.</p><p>A primera vista, la actividad parece sencilla: buscar un proveedor, preguntar el precio y realizar el pedido.</p><p>Sin embargo, surgen preguntas:</p><p>¿De qué tamaño deben ser las cajas? ¿Cuánto peso deben soportar? ¿Cuántas existen en almacén? ¿Cuándo se utilizarán? ¿Quién autoriza el gasto? ¿El precio incluye transporte? ¿Qué ocurrirá si llegan húmedas o dañadas?</p><p>Si estas preguntas no se responden, es posible adquirir 1,000 cajas que no sirvan para empacar el producto.</p><p>El problema sería más amplio que el dinero gastado: también podrían retrasarse los embarques, ocuparse espacio innecesario y generarse una compra urgente.</p><p><strong>Una compra exitosa comienza con una necesidad bien definida y termina con la comprobación de que esa necesidad fue atendida.</strong></p></div></details><details><summary>3. ¿Qué es el proceso de compras?</summary><div class=\"note-body\"><p>El proceso de compras es el conjunto ordenado de actividades mediante el cual una organización identifica una necesidad, autoriza su atención, selecciona una fuente de suministro y obtiene los bienes o servicios requeridos.</p><p>Un proceso tiene cuatro componentes básicos:</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Componente</th><th scope=\"col\">Significado</th><th scope=\"col\">Ejemplo</th></tr></thead><tbody><tr><td>Entrada</td><td>Información o necesidad que inicia el proceso.</td><td>Solicitud de cajas para un pedido.</td></tr><tr><td>Actividades</td><td>Acciones que transforman la necesidad en una solución.</td><td>Especificar, cotizar, evaluar y ordenar.</td></tr><tr><td>Controles</td><td>Verificaciones que previenen errores.</td><td>Autorización del gasto e inspección.</td></tr><tr><td>Salida</td><td>Resultado obtenido.</td><td>Cajas conformes disponibles para empaque.</td></tr></tbody></table></div><p>La salida no debe confundirse con “haber enviado una orden”. La orden es un documento intermedio; el resultado operativo es disponer del recurso requerido.</p><p>El ciclo profesional de CIPS comienza con la definición de necesidades y especificaciones e incorpora análisis del mercado, evaluación de ofertas y actividades posteriores a la contratación. Esto permite entender las compras como un ciclo completo. [1]</p><p><strong>No existe una cantidad universal de etapas.</strong> Cada empresa adapta su procedimiento según el monto, el riesgo, el tipo de suministro y su organización. En esta clase utilizaremos un modelo didáctico de compra empresarial.</p></div></details><details><summary>4. Primera etapa: identificación y justificación de la necesidad</summary><div class=\"note-body\"><p>Una necesidad aparece cuando existe una diferencia entre los recursos disponibles y los recursos requeridos para realizar una actividad.</p><p>Puede originarse por:</p><ul><li>Un programa de producción.</li><li>El agotamiento de materiales.</li><li>La falla de un equipo.</li><li>La apertura de una sucursal.</li><li>La contratación de un servicio.</li><li>La sustitución de herramientas.</li><li>Un proyecto de mejora.</li></ul><p>Identificar la necesidad implica precisar <strong>qué problema se busca resolver</strong>.</p><p>Por ejemplo, “comprar una impresora” describe una solución propuesta. La necesidad real podría ser “imprimir 5,000 hojas mensuales con buena legibilidad y bajo costo por página”.</p><p>Comprender esa necesidad permite comparar alternativas: adquirir un equipo, reparar el existente, contratar un servicio o compartir un recurso disponible.</p><p><strong>Justificar una compra significa demostrar su relación con una actividad o resultado necesario para la organización.</strong></p><p>Una solicitud sin justificación puede generar gastos por costumbre, preferencia personal o duplicidad.</p></div></details><details><summary>5. Segunda etapa: revisión de inventarios y recursos disponibles</summary><div class=\"note-body\"><p>Antes de comprar se revisa si la organización ya cuenta con recursos suficientes.</p><p>Esta revisión debe considerar:</p><ul><li>Existencias utilizables.</li><li>Material reservado para otros pedidos.</li><li>Productos dañados o bloqueados.</li><li>Órdenes pendientes de entrega.</li><li>Material disponible en otras áreas.</li><li>Posibles sustitutos técnicamente autorizados.</li></ul><p><strong>Existencia física no significa disponibilidad.</strong> Puede haber 500 piezas en almacén, pero si 400 están comprometidas con otro pedido, solamente 100 están disponibles para una necesidad nueva.</p><p>Una fórmula básica para estimar la compra es:</p><p class=\"formula\">Q = max(0, D + S − I − P)</p><p>Donde:</p><ul><li><strong>Q:</strong> cantidad por comprar.</li><li><strong>D:</strong> demanda del periodo.</li><li><strong>S:</strong> inventario que se desea conservar al final.</li><li><strong>I:</strong> inventario inicial utilizable.</li><li><strong>P:</strong> recepciones confirmadas que llegarán a tiempo.</li></ul><p><strong>Ejemplo:</strong></p><p>La empresa necesita 1,000 cajas, desea conservar 100 como reserva, tiene 250 utilizables y recibirá 150 antes de utilizarlas.</p><p class=\"formula\">Q = 1,000 + 100 − 250 − 150</p><p class=\"formula\">Q = 700 cajas</p><p>La comprobación es:</p><p class=\"formula\">250 + 150 + 700 − 1,000 = 100</p><p>Después de atender la demanda quedarán las 100 cajas de reserva.</p><p>Este cálculo supone que la demanda y las recepciones corresponden al mismo periodo. Después deben revisarse restricciones como paquetes completos o cantidades mínimas del proveedor.</p></div></details><details><summary>6. Tercera etapa: definición de especificaciones</summary><div class=\"note-body\"><p>Una especificación establece las características que debe cumplir un bien o servicio para resultar aceptable.</p><p>Para un material puede incluir:</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Característica</th><th scope=\"col\">Ejemplo para cajas</th></tr></thead><tbody><tr><td>Dimensiones</td><td>Medidas interiores y tolerancias.</td></tr><tr><td>Material</td><td>Tipo de cartón requerido.</td></tr><tr><td>Resistencia</td><td>Capacidad definida según el producto y la estiba.</td></tr><tr><td>Presentación</td><td>Cajas nuevas, secas y sin deformaciones.</td></tr><tr><td>Cantidad</td><td>Número de unidades.</td></tr><tr><td>Identificación</td><td>Código, impresión o etiqueta.</td></tr><tr><td>Entrega</td><td>Fecha, horario y ubicación.</td></tr><tr><td>Aceptación</td><td>Verificaciones que se realizarán al recibir.</td></tr></tbody></table></div><p>Solicitar “cajas grandes y resistentes” deja demasiado espacio a la interpretación. Dos proveedores pueden ofrecer artículos diferentes y ambos considerar que cumplen.</p><p>En los servicios también se necesitan especificaciones. Para mantenimiento, por ejemplo, deben definirse los equipos incluidos, las actividades, los horarios, los entregables y los criterios de aceptación.</p><p><strong>La calidad debe describirse mediante requisitos verificables.</strong></p><p>También conviene distinguir entre:</p><ul><li><strong>Requisito obligatorio:</strong> condición indispensable para aceptar la propuesta.</li><li><strong>Preferencia:</strong> característica deseable que puede compararse con otras ventajas.</li></ul><p>Un precio atractivo no compensa el incumplimiento de un requisito indispensable.</p></div></details><details><summary>7. Cuarta etapa: elaboración de la requisición de compra</summary><div class=\"note-body\"><p>La requisición es una solicitud interna mediante la cual un área comunica formalmente lo que necesita adquirir.</p><p>Generalmente incluye:</p><ul><li>Folio y fecha.</li><li>Área solicitante.</li><li>Descripción y especificaciones.</li><li>Cantidad y unidad de medida.</li><li>Fecha requerida.</li><li>Justificación.</li><li>Centro de costos o proyecto.</li><li>Nombre del solicitante.</li><li>Autorizaciones correspondientes.</li></ul><p><strong>Ejemplo:</strong></p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Campo</th><th scope=\"col\">Información</th></tr></thead><tbody><tr><td>Folio</td><td>REQ-025</td></tr><tr><td>Área</td><td>Producción</td></tr><tr><td>Material</td><td>Caja de cartón conforme a ficha técnica CT-08</td></tr><tr><td>Cantidad</td><td>700</td></tr><tr><td>Unidad</td><td>Pieza</td></tr><tr><td>Fecha requerida</td><td>Antes del inicio del siguiente lote</td></tr><tr><td>Justificación</td><td>Empaque de pedido confirmado y conservación de reserva</td></tr></tbody></table></div><p>La requisición permite que Compras trabaje con información documentada.</p><p><strong>Una requisición no es una orden al proveedor.</strong> Expresa una necesidad dentro de la organización; todavía debe pasar por las validaciones correspondientes.</p></div></details><details><summary>8. Quinta etapa: autorización y revisión presupuestal</summary><div class=\"note-body\"><p>La autorización verifica si la compra está justificada y si existe capacidad para asumir el compromiso económico.</p><p>Se revisan aspectos como:</p><ul><li>Necesidad real.</li><li>Prioridad.</li><li>Presupuesto.</li><li>Monto estimado.</li><li>Nivel de autorización requerido.</li><li>Alternativas disponibles.</li></ul><p>Presupuesto y efectivo no son lo mismo. Una compra puede estar contemplada en el presupuesto anual, pero requerir una programación de pagos para no afectar otras obligaciones.</p><p>Si la solicitud no se autoriza, el proceso debe indicar qué sucede:</p><ul><li>Se devuelve para corregir información.</li><li>Se modifica la cantidad o el alcance.</li><li>Se pospone.</li><li>Se cancela.</li></ul><p><strong>Una negativa también forma parte del proceso.</strong> Un diagrama que solamente muestra autorizaciones favorables representa de manera incompleta la operación.</p></div></details><details><summary>9. Sexta etapa: búsqueda de proveedores y solicitud de cotizaciones</summary><div class=\"note-body\"><p>Con la necesidad definida, se identifican proveedores capaces de atenderla.</p><p>La búsqueda debe considerar capacidad técnica, disponibilidad, ubicación, experiencia y cumplimiento previo.</p><p>Posteriormente se solicita una cotización: una propuesta del proveedor que describe lo que ofrece y sus condiciones comerciales.</p><p>Para comparar correctamente, los proveedores deben recibir requisitos equivalentes.</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Dato solicitado</th><th scope=\"col\">Utilidad</th></tr></thead><tbody><tr><td>Precio unitario</td><td>Calcular el importe de los bienes.</td></tr><tr><td>Cantidad y presentación</td><td>Evitar confundir piezas, cajas o paquetes.</td></tr><tr><td>Transporte</td><td>Identificar costos adicionales.</td></tr><tr><td>Plazo de entrega</td><td>Verificar oportunidad.</td></tr><tr><td>Condiciones de pago</td><td>Evaluar el efecto sobre la liquidez.</td></tr><tr><td>Garantía</td><td>Conocer la respuesta ante fallas.</td></tr><tr><td>Vigencia</td><td>Saber hasta cuándo se mantienen las condiciones.</td></tr><tr><td>Cumplimiento técnico</td><td>Confirmar que la oferta satisface la necesidad.</td></tr></tbody></table></div><p><strong>Comparar precios de productos distintos no equivale a comparar propuestas equivalentes.</strong></p><p>El número de cotizaciones depende de las políticas y circunstancias de la organización. Obtener tres cotizaciones puede ser un control interno, pero no es una regla universal para todas las compras.</p></div></details><details><summary>10. Séptima etapa: evaluación y selección del proveedor</summary><div class=\"note-body\"><p>La evaluación determina qué propuesta ofrece mejores condiciones para satisfacer la necesidad.</p><p>Conviene realizarla en dos momentos.</p><p><strong>Primero: verificar los requisitos obligatorios.</strong></p><p>Se descartan o aclaran propuestas que incumplan condiciones indispensables: dimensiones, compatibilidad, capacidad o fecha máxima de entrega.</p><p><strong>Después: comparar las propuestas aceptables.</strong></p><p>Entre las opciones que cumplen, pueden evaluarse costo, garantía, servicio, condiciones de pago y desempeño.</p><p><strong>Ejemplo didáctico: compra de 700 cajas.</strong></p><p>Todos los importes están expresados en pesos y sin impuestos, bajo una misma base de comparación.</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Concepto</th><th scope=\"col\">Proveedor A</th><th scope=\"col\">Proveedor B</th><th scope=\"col\">Proveedor C</th></tr></thead><tbody><tr><td>Precio por caja</td><td>$18</td><td>$19</td><td>$17</td></tr><tr><td>Importe de 700 cajas</td><td>$12,600</td><td>$13,300</td><td>$11,900</td></tr><tr><td>Transporte</td><td>$1,400</td><td>Incluido</td><td>$900</td></tr><tr><td>Total comparado</td><td>$14,000</td><td>$13,300</td><td>$12,800</td></tr><tr><td>Entrega</td><td>4 días</td><td>3 días</td><td>10 días</td></tr><tr><td>Cumple especificaciones</td><td>Sí</td><td>Sí</td><td>Sí</td></tr></tbody></table></div><p>Si las cajas deben llegar en un máximo de cinco días, C no cumple el plazo, aunque presente el menor total.</p><p>Entre A y B, el proveedor B tiene menor costo entregado y menor plazo.</p><p><strong>La selección debe justificarse con los datos disponibles.</strong> Si cambian las condiciones, debe revisarse la decisión.</p></div></details><details><summary>11. Octava etapa: negociación y formalización de la compra</summary><div class=\"note-body\"><p>Negociar significa acordar condiciones que permitan cumplir la necesidad y distribuir claramente las responsabilidades.</p><p>La negociación puede incluir:</p><ul><li>Precio.</li><li>Fechas y entregas parciales.</li><li>Transporte.</li><li>Plazo de pago.</li><li>Garantía.</li><li>Reposición de productos rechazados.</li><li>Atención de incumplimientos.</li></ul><p>Después se formaliza la adquisición mediante una orden de compra o el instrumento contractual correspondiente.</p><p>La orden de compra comunica al proveedor qué se solicita y bajo qué condiciones.</p><p>Debe existir coherencia entre los documentos:</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Documento</th><th scope=\"col\">Quién lo emite normalmente</th><th scope=\"col\">Función</th></tr></thead><tbody><tr><td>Requisición</td><td>Área solicitante</td><td>Comunicar una necesidad interna.</td></tr><tr><td>Cotización</td><td>Proveedor</td><td>Presentar una oferta.</td></tr><tr><td>Orden de compra</td><td>Organización compradora</td><td>Formalizar el pedido autorizado.</td></tr><tr><td>Registro de recepción</td><td>Área receptora</td><td>Documentar lo recibido.</td></tr><tr><td>Factura</td><td>Proveedor</td><td>Documentar el cobro correspondiente.</td></tr></tbody></table></div><p><strong>Solicitar, ofrecer, ordenar, recibir y cobrar son actos diferentes.</strong></p><p>La confirmación del proveedor permite detectar discrepancias antes del envío: cantidades, fechas, modelos o condiciones mal interpretadas.</p></div></details><details><summary>12. Novena etapa: seguimiento del pedido</summary><div class=\"note-body\"><p>El seguimiento comprueba que el proveedor avance hacia el cumplimiento de lo acordado.</p><p>Puede incluir:</p><ul><li>Confirmación de disponibilidad.</li><li>Revisión de fechas comprometidas.</li><li>Verificación del embarque.</li><li>Coordinación del transporte.</li><li>Avisos de retraso.</li><li>Preparación de la recepción.</li></ul><p>El seguimiento debe ajustarse al riesgo. Un material estándar disponible localmente no requiere necesariamente el mismo control que una pieza especial con semanas de fabricación.</p><p><strong>Ejemplo:</strong></p><p>El proveedor informa que entregará las cajas dos días después de lo acordado.</p><p>Si Compras detecta el problema con anticipación, puede negociar una entrega parcial, buscar una alternativa o coordinar un ajuste con Producción.</p><p>Si lo descubre el día de uso, las alternativas serán más limitadas.</p><p>El propósito del seguimiento es <strong>detectar desviaciones mientras todavía existe oportunidad de actuar</strong>.</p></div></details><details><summary>13. Décima etapa: recepción, inspección y atención de diferencias</summary><div class=\"note-body\"><p>La recepción verifica lo que llega. La inspección determina si cumple los requisitos establecidos.</p><p>Son verificaciones relacionadas, pero distintas:</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Verificación</th><th scope=\"col\">Pregunta</th></tr></thead><tbody><tr><td>Cantidad</td><td>¿Llegó el número solicitado?</td></tr><tr><td>Identidad</td><td>¿Es el material o modelo correcto?</td></tr><tr><td>Condición</td><td>¿Presenta daños visibles?</td></tr><tr><td>Calidad</td><td>¿Cumple las especificaciones?</td></tr><tr><td>Documentación</td><td>¿Corresponde al pedido?</td></tr></tbody></table></div><p><strong>Ejemplo:</strong></p><p>Se solicitaron 700 cajas. Llegaron 700, pero 80 están húmedas.</p><p>La entrega está completa en cantidad física, pero solamente 620 cajas están conformes.</p><p>Las 80 restantes deben identificarse y controlarse para evitar su utilización accidental. Posteriormente se acuerda su reposición, devolución u otra solución autorizada.</p><p><strong>Recibir físicamente un material no significa aceptarlo como conforme.</strong></p><p>En servicios, la recepción se realiza mediante evidencias de ejecución: reportes, entregables, pruebas de funcionamiento o aceptación del área usuaria.</p></div></details><details><summary>14. Undécima etapa: validación documental, pago y evaluación</summary><div class=\"note-body\"><p>Antes de procesar el pago, un control habitual consiste en comparar:</p><ol><li>Lo solicitado en la orden.</li><li>Lo recibido y aceptado.</li><li>Lo facturado por el proveedor.</li></ol><p>Si se pidieron 700 cajas y solamente se aceptaron 620, la diferencia debe resolverse conforme a las condiciones pactadas antes de aprobar un cobro que no corresponda.</p><p>El momento del pago puede variar: contado, anticipo, crédito o pagos por avances. El proceso debe representar la modalidad realmente acordada.</p><p>Después se evalúa el desempeño del proveedor.</p><p><strong>Ejemplo de indicador de rechazo:</strong></p><p class=\"formula\">Porcentaje de rechazo = (Unidades rechazadas / Unidades recibidas) × 100</p><p class=\"formula\">(80 / 700) × 100 = 11.43 %</p><p>Ese resultado describe esta entrega; no basta por sí solo para juzgar toda la relación comercial. Deben considerarse recurrencia, gravedad y respuesta del proveedor.</p><p>La información obtenida sirve para decidir si se mantiene la relación, se solicita una mejora o se buscan alternativas.</p></div></details><details><summary>15. ¿Qué es un diagrama de flujo del proceso de compras?</summary><div class=\"note-body\"><p>Es una representación gráfica que muestra las actividades, decisiones y rutas del proceso.</p><p>Permite identificar:</p><ul><li>Qué sucede primero.</li><li>Qué actividad depende de otra.</li><li>Dónde se autoriza o verifica.</li><li>Qué ocurre cuando existe un problema.</li><li>En qué momento termina cada ruta.</li></ul><p>Los símbolos básicos son:</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Símbolo</th><th scope=\"col\">Uso</th></tr></thead><tbody><tr><td>Óvalo o terminal</td><td>Inicio y fin.</td></tr><tr><td>Rectángulo</td><td>Actividad.</td></tr><tr><td>Rombo</td><td>Decisión.</td></tr><tr><td>Flecha</td><td>Dirección del flujo.</td></tr><tr><td>Documento</td><td>Registro utilizado o generado.</td></tr></tbody></table></div><p>Las actividades se redactan con verbos: <strong>revisar inventario, evaluar propuestas, emitir orden</strong>.</p><p>Las decisiones se redactan como preguntas: <strong>¿se autoriza?, ¿cumple?, ¿existe inventario suficiente?</strong></p><p>Cada salida de una decisión debe identificarse, por ejemplo, con “Sí” y “No”.</p></div></details><details><summary>16. Diagrama explicado del proceso general</summary><div class=\"note-body\"><p>Para facilitar la lectura, el proceso se divide en partes conectadas. La selección y el cumplimiento se muestran en dos paneles para conservar la legibilidad.</p><p><strong>El diagrama debe mostrar cómo funciona el proceso y qué sucede cuando algo no sale conforme a lo previsto.</strong></p><p><strong>Primera parte: necesidad y autorización.</strong></p><img loading=\"lazy\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkoAAAYJCAYAAAAeeUXKAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAjXwA
