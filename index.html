yRJKAAAAAACAZAklAAAAAABAsoQSAAAAAAAgWUIJAAAAAACQLKEEAAAAAABIllACAAAAAAAkSygBAAAAAACSJZQAAAAAAADJEkoAAAAAAIBkCSUAAAAAAECyhBIAAAAAACBZQgkAAAAAAJAsoQQAAAAAAEiWUAIAAAAAACRLKAEAAAAAAJIllAAAAAAAAMkSSgAAAAAAgGQJJQAAAAAAQLL+H+KG1VWMFnchAAAAAElFTkSuQmCC\" alt=\"Diagrama del proceso de compras con actividades y rutas de decisión\" /><p>Este modelo supone una compra con pago posterior a la recepción. Una operación con anticipo requiere agregar su autorización y seguimiento.</p><p>La ruta de incumplimiento es esencial: devolver o cancelar un pedido puede cerrar una operación administrativa, pero dejar pendiente la necesidad original.</p></div></details><details><summary>17. Tipos y clasificación: una compra puede pertenecer a varias categorías</summary><div class=\"note-body\"><p>Clasificar consiste en agrupar compras según una característica.</p><p>Una compra puede ser simultáneamente:</p><ul><li>Directa.</li><li>Nacional.</li><li>Programada.</li><li>Recurrente.</li><li>Centralizada.</li></ul><p>No existe contradicción: cada término responde a una pregunta diferente.</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Criterio</th><th scope=\"col\">Pregunta que responde</th></tr></thead><tbody><tr><td>Destino</td><td>¿Para qué se utilizará?</td></tr><tr><td>Objeto</td><td>¿Qué se adquiere?</td></tr><tr><td>Frecuencia</td><td>¿Con qué regularidad?</td></tr><tr><td>Planeación</td><td>¿Se anticipó la necesidad?</td></tr><tr><td>Procedencia</td><td>¿De dónde se obtiene?</td></tr><tr><td>Organización</td><td>¿Quién toma la decisión?</td></tr><tr><td>Riesgo</td><td>¿Qué ocurre si falta?</td></tr></tbody></table></div><p><strong>La clasificación resulta útil cuando orienta la forma de administrar la compra.</strong> Memorizar nombres sin relacionarlos con decisiones aporta poco valor.</p></div></details><details><summary>18. Compras según su destino: directas e indirectas</summary><div class=\"note-body\"><p>Las compras directas corresponden a bienes o servicios vinculados directamente con la elaboración del producto o la prestación principal que la empresa vende.</p><p>Las indirectas sostienen el funcionamiento de la organización sin incorporarse de la misma forma a su oferta principal. Esta distinción también se utiliza en la explicación de procurement de Oracle NetSuite. [2]</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Empresa</th><th scope=\"col\">Compra directa</th><th scope=\"col\">Compra indirecta</th></tr></thead><tbody><tr><td>Panadería</td><td>Harina para producir pan.</td><td>Papel de oficina.</td></tr><tr><td>Fábrica de muebles</td><td>Madera para fabricar mesas.</td><td>Servicio de limpieza administrativa.</td></tr><tr><td>Fábrica de arneses</td><td>Cable y terminales del producto.</td><td>Material de oficina.</td></tr></tbody></table></div><p>La clasificación depende del uso.</p><p>Una computadora para el área administrativa de una comercializadora es una compra de apoyo. Una computadora adquirida por esa misma empresa para revenderla es mercancía de su actividad comercial.</p><p><strong>Indirecta no significa poco importante.</strong> Un servicio de mantenimiento puede ser indirecto y, al mismo tiempo, indispensable para la continuidad de la planta.</p></div></details><details><summary>19. Compras según su objeto: materiales, activos y servicios</summary><div class=\"note-body\"><p><strong>Materiales y componentes.</strong> Se consumen o incorporan en las operaciones: materia prima, empaques, tornillos o piezas.</p><p><strong>Bienes de capital.</strong> Se adquieren para utilizarse durante varios periodos: maquinaria, vehículos o equipos. Su evaluación debe considerar instalación, capacidad, mantenimiento, consumo y vida útil.</p><p><strong>Suministros de mantenimiento, reparación y operación.</strong> Suelen agruparse como MRO: refacciones, lubricantes y herramientas de apoyo.</p><p><strong>Servicios.</strong> Se contrata una actividad o resultado: transporte, limpieza, capacitación, mantenimiento o asesoría.</p><p>La diferencia modifica los criterios de aceptación.</p><p>Para un tornillo puede verificarse longitud, diámetro y material. Para un servicio de mantenimiento, debe comprobarse el trabajo ejecutado y el funcionamiento del equipo.</p><p><strong>Comprar servicios exige definir resultados observables; expresiones como “dar buen servicio” son insuficientes.</strong></p></div></details><details><summary>20. Compras según su frecuencia y planeación</summary><div class=\"note-body\"><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Tipo</th><th scope=\"col\">Característica</th><th scope=\"col\">Ejemplo</th></tr></thead><tbody><tr><td>Recurrente</td><td>Se repite con regularidad.</td><td>Empaques mensuales.</td></tr><tr><td>Ocasional</td><td>Se realiza de forma esporádica.</td><td>Mobiliario para una ampliación.</td></tr><tr><td>Programada</td><td>Se anticipa con información suficiente.</td><td>Material para el siguiente mes.</td></tr><tr><td>Estacional</td><td>Responde a una temporada.</td><td>Insumos para demanda navideña.</td></tr><tr><td>Urgente</td><td>Requiere atención en un plazo reducido.</td><td>Refacción por avería inesperada.</td></tr></tbody></table></div><p>Una compra urgente puede ser necesaria, pero normalmente reduce el tiempo para comparar opciones y puede generar transporte extraordinario.</p><p>La urgencia puede surgir por un evento imprevisible o por una falla interna: solicitud tardía, inventario incorrecto o falta de seguimiento.</p><p>Por eso conviene investigar su causa.</p><p><strong>Resolver una emergencia atiende el problema inmediato; identificar por qué ocurrió ayuda a evitar su repetición.</strong></p><p>Un mismo material puede adquirirse regularmente de forma programada y, en otra ocasión, comprarse de urgencia.</p></div></details><details><summary>21. Compras según procedencia y organización</summary><div class=\"note-body\"><p><strong>Según procedencia:</strong></p><ul><li><strong>Locales:</strong> abastecimiento cercano al punto de uso.</li><li><strong>Nacionales:</strong> adquisición dentro del país.</li><li><strong>Internacionales:</strong> adquisición desde otro país.</li></ul><p>Una compra local también es nacional. Además, comprar a un distribuidor nacional no significa que el producto haya sido fabricado en México.</p><p>La procedencia influye en los tiempos, transporte, comunicación y exposición a interrupciones.</p><p><strong>Según organización:</strong></p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Modalidad</th><th scope=\"col\">Funcionamiento</th><th scope=\"col\">Ventaja posible</th><th scope=\"col\">Riesgo posible</th></tr></thead><tbody><tr><td>Centralizada</td><td>Un área concentra las compras.</td><td>Negociación conjunta y estandarización.</td><td>Menor agilidad local.</td></tr><tr><td>Descentralizada</td><td>Cada unidad gestiona sus adquisiciones.</td><td>Cercanía con la necesidad.</td><td>Duplicidad y precios distintos.</td></tr><tr><td>Mixta</td><td>Se distribuyen responsabilidades por categoría o monto.</td><td>Combina coordinación y respuesta local.</td><td>Requiere límites claros.</td></tr></tbody></table></div><p>Ninguna modalidad es superior en todas las situaciones.</p><p>Una organización puede negociar centralmente un contrato de papelería y permitir que cada sucursal solicite entregas conforme a su consumo.</p></div></details><details><summary>22. Modalidades de abastecimiento</summary><div class=\"note-body\"><p>El abastecimiento se refiere a cómo se mantiene la disponibilidad de recursos a lo largo del tiempo.</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Modalidad</th><th scope=\"col\">Funcionamiento</th><th scope=\"col\">Aspecto que debe controlarse</th></tr></thead><tbody><tr><td>Para inventario</td><td>Se compra antes del consumo y se conserva una existencia.</td><td>Exceso, deterioro y capital inmovilizado.</td></tr><tr><td>Bajo pedido</td><td>Se adquiere al aparecer una necesidad específica.</td><td>Tiempo de respuesta.</td></tr><tr><td>Entregas programadas</td><td>Se acuerdan cantidades y fechas sucesivas.</td><td>Cambios en la demanda.</td></tr><tr><td>Justo a tiempo</td><td>Se sincronizan entregas cercanas al uso.</td><td>Confiabilidad y capacidad de respuesta.</td></tr><tr><td>Consignación</td><td>El proveedor mantiene la propiedad hasta el evento pactado, normalmente el consumo.</td><td>Registros, responsabilidades y conciliación.</td></tr></tbody></table></div><p>Justo a tiempo no significa simplemente eliminar todo inventario. Requiere coordinar demanda, entregas y calidad para que la reducción de existencias no se transforme en interrupciones.</p><p>También puede utilizarse una fuente o varias:</p><ul><li><strong>Una fuente seleccionada:</strong> se concentra la compra en un proveedor aunque existan alternativas.</li><li><strong>Única fuente disponible:</strong> no se ha identificado otra opción viable.</li><li><strong>Fuentes múltiples:</strong> se distribuye el suministro entre varios proveedores.</li></ul><p>La segunda situación implica una dependencia distinta a la primera. Tener un solo proveedor por elección no equivale a carecer de alternativas.</p></div></details><details><summary>23. Clasificación según impacto y riesgo</summary><div class=\"note-body\"><p>La atención que recibe una compra debe ser proporcional a sus consecuencias.</p><p>Para un análisis inicial se pueden utilizar dos preguntas:</p><ol><li>¿Qué impacto económico u operativo tiene?</li><li>¿Qué dificultad existe para conseguirla o sustituirla?</li></ol><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Situación</th><th scope=\"col\">Ejemplo ilustrativo</th><th scope=\"col\">Enfoque de gestión</th></tr></thead><tbody><tr><td>Bajo impacto y suministro sencillo</td><td>Papelería estándar.</td><td>Simplificar trámites y controlar consumos.</td></tr><tr><td>Alto gasto y varias alternativas</td><td>Empaque estándar en grandes volúmenes.</td><td>Comparar costos y negociar condiciones.</td></tr><tr><td>Bajo precio y pocas alternativas</td><td>Sensor especial de una máquina.</td><td>Proteger continuidad y buscar sustitutos.</td></tr><tr><td>Alto impacto y suministro difícil</td><td>Componente esencial desarrollado a medida.</td><td>Planear capacidad y gestionar la relación.</td></tr></tbody></table></div><p><strong>El precio del artículo no representa necesariamente el costo de su ausencia.</strong></p><p>Un sensor de $900 puede detener un equipo cuyo paro resulte mucho más costoso. Por eso, clasificar solamente por el importe de compra puede ocultar riesgos importantes.</p></div></details><details><summary>24. Principios básicos: calidad, cantidad, oportunidad, lugar y precio</summary><div class=\"note-body\"><p>Estos principios funcionan como preguntas para comprobar si la adquisición satisface la necesidad.</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Principio</th><th scope=\"col\">Pregunta principal</th><th scope=\"col\">Ejemplo de incumplimiento</th></tr></thead><tbody><tr><td>Calidad adecuada</td><td>¿Cumple los requisitos de uso?</td><td>Comprar una caja que no soporta el producto.</td></tr><tr><td>Cantidad adecuada</td><td>¿Cubre la necesidad sin exceso injustificado?</td><td>Comprar para un año cuando el material caduca pronto.</td></tr><tr><td>Momento adecuado</td><td>¿Estará disponible antes de utilizarse?</td><td>Recibir insumos después del embarque.</td></tr><tr><td>Lugar adecuado</td><td>¿Llegará al punto acordado?</td><td>Entregar en otra sucursal.</td></tr><tr><td>Precio y condiciones convenientes</td><td>¿La contraprestación es razonable para lo recibido?</td><td>Elegir un precio bajo con costos adicionales superiores.</td></tr></tbody></table></div><p><strong>Calidad adecuada</strong> no significa adquirir siempre la alternativa de mayor desempeño. Significa cumplir el uso previsto, evitando tanto insuficiencia como características innecesarias.</p><p><strong>Cantidad adecuada</strong> exige equilibrar el riesgo de faltante con el costo del inventario.</p><p><strong>Momento adecuado</strong> se calcula considerando todo el tiempo necesario.</p><p>Si se requieren:</p><ul><li>Dos días para autorización.</li><li>Tres días para cotizar y seleccionar.</li><li>Cuatro días para entrega.</li><li>Un día para inspección.</li></ul><p>Entonces, si las actividades son consecutivas:</p><p class=\"formula\">T = 2 + 3 + 4 + 1 = 10 días</p><p>La gestión debe comenzar al menos diez días antes del uso, más el margen que corresponda a la incertidumbre. Debe aclararse si son días hábiles o naturales.</p></div></details><details><summary>25. Principios complementarios: costo total, ética, control y sostenibilidad</summary><div class=\"note-body\"><p><strong>Costo total.</strong></p><p>El precio es una parte del costo de adquirir y utilizar un recurso.</p><p>En un equipo pueden agregarse instalación, consumo de energía, mantenimiento y disposición final.</p><p><strong>Ejemplo didáctico a tres años:</strong></p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Concepto</th><th scope=\"col\">Equipo A</th><th scope=\"col\">Equipo B</th></tr></thead><tbody><tr><td>Compra</td><td>$20,000</td><td>$24,000</td></tr><tr><td>Energía durante tres años</td><td>$15,000</td><td>$9,000</td></tr><tr><td>Mantenimiento durante tres años</td><td>$6,000</td><td>$3,000</td></tr><tr><td>Total simplificado</td><td>$41,000</td><td>$36,000</td></tr></tbody></table></div><p>B cuesta más al inicio, pero presenta menor total en este escenario. Se supone capacidad equivalente y se omiten financiamiento, impuestos y valor residual.</p><p><strong>Ética e imparcialidad.</strong></p><p>Las decisiones deben basarse en criterios verificables. Un regalo, amistad o beneficio personal no debe sustituir la evaluación de las propuestas.</p><p>Si existe un conflicto de interés, debe declararse y gestionarse conforme a las reglas de la organización.</p><p><strong>Separación de funciones.</strong></p><p>Conviene distribuir la solicitud, autorización, recepción y pago para reducir errores y evitar que una sola persona controle toda la operación sin revisión.</p><p><strong>Trazabilidad.</strong></p><p>Debe ser posible reconstruir qué se solicitó, quién autorizó, por qué se eligió al proveedor, qué se recibió y qué se pagó.</p><p><strong>Sostenibilidad.</strong></p><p>La decisión puede considerar durabilidad, reparabilidad, consumo de recursos, empaque y generación de residuos. Estos aspectos deben transformarse en criterios verificables, en lugar de aceptar afirmaciones generales como “producto ecológico”.</p></div></details><details><summary>26. Actividad de clasificación y análisis de casos</summary><div class=\"note-body\"><p><strong>Actividad A. Clasificación de compras</strong></p><p>Clasifica cada situación utilizando al menos tres criterios y justifica tus respuestas.</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Situación</th><th scope=\"col\">Criterios que puedes utilizar</th></tr></thead><tbody><tr><td>Una panadería compra harina semanalmente a un proveedor de la ciudad.</td><td>Destino, frecuencia y procedencia.</td></tr><tr><td>Una fábrica adquiere de emergencia un sensor que llega del extranjero.</td><td>Objeto, planeación y procedencia.</td></tr><tr><td>Una universidad contrata limpieza por un año.</td><td>Objeto, destino y continuidad del suministro.</td></tr><tr><td>Una cadena negocia computadoras para todas sus sucursales.</td><td>Objeto, organización y frecuencia.</td></tr><tr><td>Un restaurante recibe verduras tres veces por semana.</td><td>Destino, frecuencia y modalidad de abastecimiento.</td></tr></tbody></table></div><p><strong>Ejemplo resuelto: harina para una panadería.</strong></p><p>Es una compra directa porque se incorpora al producto vendido; recurrente porque se realiza semanalmente; y local porque el proveedor está en la misma ciudad.</p><p>No se puede afirmar automáticamente que sea programada: para ello debe conocerse si se anticipó la cantidad y la fecha.</p><p><strong>Actividad B. Principios aplicados</strong></p><p>Analiza los siguientes casos:</p><p><strong>Caso 1. El descuento por volumen.</strong> Una empresa consume 100 litros mensuales de un producto. Le ofrecen descuento por comprar 2,000 litros, pero el material tiene una vida útil restante de seis meses.</p><p>Al consumo actual utilizaría aproximadamente 600 litros antes del vencimiento. Deben revisarse caducidad, almacenamiento y demanda antes de aceptar.</p><p><strong>Caso 2. El material que llegó tarde.</strong> El proveedor entregó el producto correcto, completo y al precio acordado, pero después de la fecha en que se necesitaba.</p><p>Se incumple la oportunidad. Debe investigarse si falló el proveedor, la planeación interna o la comunicación de la fecha.</p><p><strong>Caso 3. La recomendación personal.</strong> Un comprador elige la empresa de un familiar sin documentar una comparación.</p><p>Existe un conflicto de interés que debe gestionarse y una ausencia de justificación objetiva. El análisis debe centrarse en transparencia, imparcialidad y controles.</p><p>Para cada caso explica <strong>qué principio está comprometido, qué consecuencia puede presentarse y qué acción tomarías</strong>.</p></div></details><details><summary>27. Actividad integradora y evidencia: diagrama del proceso de compras</summary><div class=\"note-body\"><p><strong>Caso: Empaques del Norte</strong></p><p>La empresa necesita 1,200 cajas para un pedido y desea conservar 100 como reserva final.</p><p>Dispone de 300 cajas utilizables y tiene confirmada la recepción de 200 antes de la fecha de consumo.</p><p>Las cajas nuevas deben estar disponibles en un máximo de cinco días. Los tres proveedores cumplen las especificaciones técnicas.</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Concepto</th><th scope=\"col\">Proveedor A</th><th scope=\"col\">Proveedor B</th><th scope=\"col\">Proveedor C</th></tr></thead><tbody><tr><td>Precio unitario</td><td>$20</td><td>$21</td><td>$18</td></tr><tr><td>Transporte por pedido</td><td>$1,000</td><td>Incluido</td><td>$800</td></tr><tr><td>Tiempo de entrega</td><td>4 días</td><td>3 días</td><td>8 días</td></tr></tbody></table></div><p><em>Importes sin impuestos y comparables sobre una misma base.</em></p><p><strong>Desarrollo solicitado:</strong></p><ol><li>Calcula la cantidad necesaria.</li><li>Calcula el total de cada propuesta.</li><li>Identifica cuáles cumplen el plazo.</li><li>Selecciona un proveedor y justifica.</li><li>Clasifica la compra con al menos tres criterios.</li><li>Elabora el diagrama desde la necesidad hasta la evaluación del proveedor.</li><li>Incluye rutas para solicitud no autorizada y material no conforme.</li></ol><p><strong>Comprobación de los cálculos:</strong></p><p class=\"formula\">Q = 1,200 + 100 − 300 − 200 = 800 cajas</p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Proveedor</th><th scope=\"col\">Cálculo</th><th scope=\"col\">Total</th></tr></thead><tbody><tr><td>A</td><td>800(20) + 1,000</td><td>$17,000</td></tr><tr><td>B</td><td>800(21)</td><td>$16,800</td></tr><tr><td>C</td><td>800(18) + 800</td><td>$15,200</td></tr></tbody></table></div><p>C no cumple el plazo. Entre las propuestas aceptables, B presenta menor total y menor tiempo de entrega, por lo que resulta preferible con los datos proporcionados.</p><p><strong>Evidencia principal: diagrama de flujo.</strong></p><p>Debe contener:</p><ul><li>Inicio y finales claramente identificados.</li><li>Actividades en secuencia lógica.</li><li>Revisión de inventarios.</li><li>Requisición y autorización.</li><li>Evaluación y selección.</li><li>Orden y seguimiento.</li><li>Recepción e inspección.</li><li>Tratamiento del incumplimiento.</li><li>Validación del pago y evaluación.</li><li>Decisiones con salidas identificadas.</li></ul><p>Se pueden agregar responsables junto a las actividades: Solicitante, Almacén, Compras, Finanzas y Calidad.</p><p><strong>Criterios sugeridos de evaluación:</strong></p><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Criterio</th><th scope=\"col\">Puntos</th></tr></thead><tbody><tr><td>Secuencia y cobertura del proceso</td><td>25</td></tr><tr><td>Decisiones y rutas de excepción</td><td>25</td></tr><tr><td>Cálculos y justificación del proveedor</td><td>20</td></tr><tr><td>Clasificación y aplicación de principios</td><td>15</td></tr><tr><td>Claridad gráfica y responsables</td><td>15</td></tr><tr><td>Total</td><td>100</td></tr></tbody></table></div><p>La presentación visual ayuda, pero la calidad del trabajo depende principalmente de que el proceso sea comprensible y funcional.</p></div></details><details><summary>28. Preguntas de repaso y lecturas de apoyo</summary><div class=\"note-body\"><p>Responde con tus propias palabras:</p><ol><li>¿Por qué una necesidad no siempre debe resolverse mediante una compra?</li><li>¿Qué diferencia existe entre inventario físico e inventario disponible?</li><li>¿Cómo afecta una especificación ambigua a la comparación de proveedores?</li><li>¿Qué diferencia existe entre requisición, cotización y orden de compra?</li><li>¿Por qué deben evaluarse los requisitos obligatorios antes de comparar ventajas?</li><li>¿Qué diferencia existe entre recibir y aceptar?</li><li>¿Qué debe ocurrir cuando una factura no coincide con lo recibido?</li><li>¿Por qué una compra puede pertenecer a varias clasificaciones?</li><li>¿Puede una compra indirecta ser crítica? Explica.</li><li>¿Por qué una compra urgente merece un análisis de causa?</li><li>¿Qué riesgos existen al comprar grandes cantidades por obtener descuento?</li><li>¿Qué rutas debe mostrar un diagrama cuando la compra no se autoriza o el producto no cumple?</li></ol><p><strong>Lecturas de apoyo:</strong></p><p>[1] CIPS — Procurement and Supply Cycle. Referencia para ampliar el estudio del ciclo profesional, desde la definición de necesidades hasta las actividades posteriores a la contratación.</p><p><a href=\"https://www.cips.org/intelligence-hub/procurement/procurement-supply-cycle\" target=\"_blank\" rel=\"noopener noreferrer\">Consultar fuente</a></p><p>[2] Oracle NetSuite — What Is Procurement? Types, Processes, and Technology. Lectura complementaria sobre conceptos, tipos y procesos de adquisición.</p><p><a href=\"https://www.netsuite.com/portal/resource/articles/accounting/procurement.shtml\" target=\"_blank\" rel=\"noopener noreferrer\">Consultar fuente</a></p><p><em>Los casos, cantidades, diagramas y actividades de esta nota son ejemplos didácticos. El procedimiento específico de cada organización debe ajustarse a su estructura, sus políticas y las características del suministro.</em></p></div></details>";
