name: Publish class pages to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'mercadotecnia-unidad-3/**'
      - '.github/workflows/publish-class-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site/mercadotecnia-unidad-3
          cp index.html _site/index.html
          cp mercadotecnia-unidad-3/index.html _site/mercadotecnia-unidad-3/index.html
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
